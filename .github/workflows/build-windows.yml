name: Build Windows app

on:
  workflow_dispatch:   # "Run workflow" button in the Actions tab

permissions:
  contents: write      # needed to create a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish Qlix.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Qlix for Windows v1.0.${{ github.run_number }}
          files: publish/Qlix.exe
